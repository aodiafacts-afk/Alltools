<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Number Tester — MathTools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050508;--panel:#0e0e16;--border:#1a1a2e;--accent:#43e97b;--text:#e8e8f0;--muted:#44445a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:2rem 1rem 4rem;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(67,233,123,0.06) 0%,transparent 60%),linear-gradient(rgba(67,233,123,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(67,233,123,0.02) 1px,transparent 1px);background-size:auto,50px 50px,50px 50px;pointer-events:none;z-index:0;}
  .wrap{position:relative;z-index:1;max-width:700px;margin:0 auto;}
  .back{display:inline-flex;align-items:center;gap:0.5rem;color:var(--muted);font-size:0.8rem;text-decoration:none;letter-spacing:0.1em;margin-bottom:2rem;transition:color 0.2s;}
  .back:hover{color:var(--accent);}
  header{text-align:center;margin-bottom:2.5rem;}
  h1{font-size:clamp(2rem,7vw,4rem);font-weight:800;background:linear-gradient(135deg,#43e97b,#38f9d7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .sub{color:var(--muted);font-size:0.75rem;letter-spacing:0.25em;font-family:'JetBrains Mono',monospace;margin-top:0.5rem;}
  .input-zone{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;}
  .num-input{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--accent);color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:2rem;padding:0.4rem 1rem;border-radius:8px;outline:none;transition:box-shadow 0.2s;}
  .num-input:focus{box-shadow:0 0 0 2px var(--accent),0 0 20px rgba(67,233,123,0.2);}
  .num-input::placeholder{color:var(--muted);}
  .btn{background:var(--accent);color:#050508;border:none;font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem;padding:0.8rem 1.8rem;border-radius:8px;cursor:pointer;transition:transform 0.1s,box-shadow 0.2s;}
  .btn:hover{box-shadow:0 0 20px rgba(67,233,123,0.5);transform:translateY(-1px);}
  .clr{background:transparent;color:var(--muted);border:1px solid var(--border);font-family:'Syne',sans-serif;font-size:0.8rem;padding:0.8rem 1.2rem;border-radius:8px;cursor:pointer;transition:color 0.2s,border-color 0.2s;}
  .clr:hover{color:#ff6584;border-color:#ff6584;}
  .result{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:2rem;text-align:center;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .verdict{font-size:clamp(1.5rem,5vw,3rem);font-weight:800;margin-bottom:0.5rem;}
  .verdict.prime{color:#43e97b;}
  .verdict.notprime{color:#ff6584;}
  .num-display{font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--muted);margin-bottom:1.5rem;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem;}
  .info-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;}
  .info-label{font-size:0.65rem;letter-spacing:0.2em;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;margin-bottom:0.4rem;}
  .info-val{font-size:1rem;font-weight:700;font-family:'JetBrains Mono',monospace;word-break:break-all;}
  .factors-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-top:1rem;}
  .factor-tag{display:inline-block;background:rgba(67,233,123,0.1);border:1px solid rgba(67,233,123,0.3);color:#43e97b;padding:0.2rem 0.6rem;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:0.8rem;margin:0.2rem;}
  .empty{text-align:center;padding:4rem 2rem;color:var(--muted);}
  .empty .big{font-size:5rem;font-weight:800;opacity:0.1;}
  .empty p{font-size:0.75rem;letter-spacing:0.2em;font-family:'JetBrains Mono',monospace;margin-top:0.5rem;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back to All Tools</a>
  <header>
    <h1>Prime Number Tester</h1>
    <div class="sub">// check primality · find factors</div>
  </header>
  <div class="input-zone">
    <input class="num-input" id="inp" type="number" placeholder="Enter number…" autofocus min="1">
    <button class="btn" onclick="run()">▶ Test</button>
    <button class="clr" onclick="clr()">✕ Clear</button>
  </div>
  <div id="out">
    <div class="empty"><div class="big">∞</div><p>Enter a number and press Test</p></div>
  </div>
</div>
<script>
  document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')run();});
  function isPrime(n){if(n<2)return false;if(n===2)return true;if(n%2===0)return false;for(let i=3;i<=Math.sqrt(n);i+=2)if(n%i===0)return false;return true;}
  function getFactors(n){const f=[];let d=2;let tmp=n;while(d*d<=tmp){while(tmp%d===0){f.push(d);tmp=Math.floor(tmp/d);}d++;}if(tmp>1)f.push(tmp);return f;}
  function getDivisors(n){const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d;}
  function run(){
    const v=parseInt(document.getElementById('inp').value);
    if(isNaN(v)||v<1){alert('Please enter a positive number');return;}
    const prime=isPrime(v);
    const factors=getFactors(v);
    const divisors=getDivisors(v);
    const factExp=factors.length?factors.reduce((a,f)=>{a[f]=(a[f]||0)+1;return a;},{}):{};
    const factStr=Object.entries(factExp).map(([b,e])=>e>1?`${b}^${e}`:b).join(' × ');
    document.getElementById('out').innerHTML=`
      <div class="result">
        <div class="verdict ${prime?'prime':'notprime'}">${prime?'✓ PRIME':'✗ NOT PRIME'}</div>
        <div class="num-display">${v.toLocaleString()} is ${prime?'a prime number':'not a prime number'}</div>
        <div class="info-grid">
          <div class="info-box"><div class="info-label">Type</div><div class="info-val">${v%2===0?'Even':'Odd'}</div></div>
          <div class="info-box"><div class="info-label">Square Root</div><div class="info-val">${Math.sqrt(v).toFixed(4)}</div></div>
          <div class="info-box"><div class="info-label">Divisors Count</div><div class="info-val">${divisors.length}</div></div>
          <div class="info-box"><div class="info-label">Is Perfect Square</div><div class="info-val">${Number.isInteger(Math.sqrt(v))?'✓ Yes':'✗ No'}</div></div>
        </div>
        ${!prime?`<div class="factors-box"><div class="info-label">Prime Factorization: ${factStr}</div><div style="margin-top:0.5rem">${factors.filter((v,i,a)=>a.indexOf(v)===i).map(f=>`<span class="factor-tag">${f}</span>`).join('')}</div></div>`:''}
        <div class="factors-box"><div class="info-label">All Divisors (${divisors.length})</div><div style="margin-top:0.5rem">${divisors.map(d=>`<span class="factor-tag">${d}</span>`).join('')}</div></div>
      </div>`;
  }
  function clr(){document.getElementById('inp').value='';document.getElementById('out').innerHTML='<div class="empty"><div class="big">∞</div><p>Enter a number and press Test</p></div>';}
</script>
</body>
</html>
