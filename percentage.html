<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage Calculator — MathTools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050508;--panel:#0e0e16;--border:#1a1a2e;--accent:#f7971e;--text:#e8e8f0;--muted:#44445a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:2rem 1rem 4rem;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(247,151,30,0.07) 0%,transparent 60%),linear-gradient(rgba(247,151,30,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(247,151,30,0.02) 1px,transparent 1px);background-size:auto,50px 50px,50px 50px;pointer-events:none;z-index:0;}
  .wrap{position:relative;z-index:1;max-width:700px;margin:0 auto;}
  .back{display:inline-flex;align-items:center;gap:0.5rem;color:var(--muted);font-size:0.8rem;text-decoration:none;letter-spacing:0.1em;margin-bottom:2rem;transition:color 0.2s;}
  .back:hover{color:var(--accent);}
  header{text-align:center;margin-bottom:2.5rem;}
  h1{font-size:clamp(2rem,7vw,4rem);font-weight:800;background:linear-gradient(135deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .sub{color:var(--muted);font-size:0.75rem;letter-spacing:0.25em;font-family:'JetBrains Mono',monospace;margin-top:0.5rem;}
  .cards{display:grid;gap:1rem;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.5rem;}
  .card-title{font-size:0.75rem;letter-spacing:0.2em;color:var(--accent);font-family:'JetBrains Mono',monospace;text-transform:uppercase;margin-bottom:1rem;}
  .row{display:flex;gap:0.8rem;align-items:center;flex-wrap:wrap;margin-bottom:0.8rem;}
  .label{font-size:0.8rem;color:var(--muted);white-space:nowrap;min-width:20px;}
  input[type=number]{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:0.5rem 0.8rem;border-radius:8px;outline:none;width:120px;transition:border-color 0.2s;}
  input[type=number]:focus{border-color:var(--accent);}
  .btn{background:var(--accent);color:#050508;border:none;font-family:'Syne',sans-serif;font-weight:700;font-size:0.8rem;padding:0.6rem 1.4rem;border-radius:8px;cursor:pointer;transition:transform 0.1s,box-shadow 0.2s;}
  .btn:hover{box-shadow:0 0 15px rgba(247,151,30,0.4);transform:translateY(-1px);}
  .answer{font-size:1.8rem;font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace;margin-top:0.8rem;min-height:2.5rem;}
  .answer-label{font-size:0.7rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:0.3rem;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back to All Tools</a>
  <header>
    <h1>Percentage Calculator</h1>
    <div class="sub">// 5 types of percentage calculations</div>
  </header>
  <div class="cards">

    <div class="card">
      <div class="card-title">① What is X% of Y?</div>
      <div class="row">
        <input type="number" id="p1a" placeholder="X %"> <span class="label">% of</span>
        <input type="number" id="p1b" placeholder="Y">
        <button class="btn" onclick="calc1()">= ?</button>
      </div>
      <div class="answer" id="r1">—</div>
      <div class="answer-label" id="l1"></div>
    </div>

    <div class="card">
      <div class="card-title">② X is what % of Y?</div>
      <div class="row">
        <input type="number" id="p2a" placeholder="X"> <span class="label">is ?% of</span>
        <input type="number" id="p2b" placeholder="Y">
        <button class="btn" onclick="calc2()">= ?</button>
      </div>
      <div class="answer" id="r2">—</div>
      <div class="answer-label" id="l2"></div>
    </div>

    <div class="card">
      <div class="card-title">③ Percentage Increase / Decrease</div>
      <div class="row">
        <span class="label">From</span>
        <input type="number" id="p3a" placeholder="Old value">
        <span class="label">To</span>
        <input type="number" id="p3b" placeholder="New value">
        <button class="btn" onclick="calc3()">= ?</button>
      </div>
      <div class="answer" id="r3">—</div>
      <div class="answer-label" id="l3"></div>
    </div>

    <div class="card">
      <div class="card-title">④ Add X% to a value</div>
      <div class="row">
        <input type="number" id="p4a" placeholder="Value">
        <span class="label">+</span>
        <input type="number" id="p4b" placeholder="X %">
        <button class="btn" onclick="calc4()">= ?</button>
      </div>
      <div class="answer" id="r4">—</div>
      <div class="answer-label" id="l4"></div>
    </div>

    <div class="card">
      <div class="card-title">⑤ Subtract X% from a value</div>
      <div class="row">
        <input type="number" id="p5a" placeholder="Value">
        <span class="label">−</span>
        <input type="number" id="p5b" placeholder="X %">
        <button class="btn" onclick="calc5()">= ?</button>
      </div>
      <div class="answer" id="r5">—</div>
      <div class="answer-label" id="l5"></div>
    </div>

  </div>
</div>
<script>
  function fmt(n){return parseFloat(n.toFixed(6)).toLocaleString();}
  function calc1(){
    const a=parseFloat(document.getElementById('p1a').value),b=parseFloat(document.getElementById('p1b').value);
    if(isNaN(a)||isNaN(b))return;
    const r=a/100*b;
    document.getElementById('r1').textContent=fmt(r);
    document.getElementById('l1').textContent=`${a}% of ${b} = ${fmt(r)}`;
  }
  function calc2(){
    const a=parseFloat(document.getElementById('p2a').value),b=parseFloat(document.getElementById('p2b').value);
    if(isNaN(a)||isNaN(b)||b===0)return;
    const r=a/b*100;
    document.getElementById('r2').textContent=fmt(r)+'%';
    document.getElementById('l2').textContent=`${a} is ${fmt(r)}% of ${b}`;
  }
  function calc3(){
    const a=parseFloat(document.getElementById('p3a').value),b=parseFloat(document.getElementById('p3b').value);
    if(isNaN(a)||isNaN(b)||a===0)return;
    const r=(b-a)/Math.abs(a)*100;
    const up=r>=0;
    document.getElementById('r3').textContent=(up?'▲ +':' ▼ ')+fmt(Math.abs(r))+'%';
    document.getElementById('r3').style.color=up?'#43e97b':'#ff6584';
    document.getElementById('l3').textContent=`${a} → ${b}: ${up?'increase':'decrease'} of ${fmt(Math.abs(r))}%`;
  }
  function calc4(){
    const a=parseFloat(document.getElementById('p4a').value),b=parseFloat(document.getElementById('p4b').value);
    if(isNaN(a)||isNaN(b))return;
    const r=a+(a*b/100);
    document.getElementById('r4').textContent=fmt(r);
    document.getElementById('l4').textContent=`${a} + ${b}% = ${fmt(r)} (added ${fmt(a*b/100)})`;
  }
  function calc5(){
    const a=parseFloat(document.getElementById('p5a').value),b=parseFloat(document.getElementById('p5b').value);
    if(isNaN(a)||isNaN(b))return;
    const r=a-(a*b/100);
    document.getElementById('r5').textContent=fmt(r);
    document.getElementById('l5').textContent=`${a} − ${b}% = ${fmt(r)} (removed ${fmt(a*b/100)})`;
  }
</script>
</body>
</html>
