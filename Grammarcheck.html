<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Grammar & Spell Checker</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons for UI elements -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* Focus outline utility */
        .focus-ring {
            transition: box-shadow 0.2s ease-in-out;
        }
        .focus-ring:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 text-blue-600">
                <i data-lucide="check-circle" class="w-6 h-6"></i>
                <h1 class="text-xl font-bold tracking-tight">GrammarCheck<span class="text-slate-800">Free</span></h1>
            </div>
            <div class="text-sm text-slate-500 hidden sm:block">
                Powered by LanguageTool API
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col lg:flex-row h-[calc(100vh-8rem)] min-h-[600px]">
            
            <!-- Left Side: Text Input -->
            <div class="flex-1 flex flex-col border-b lg:border-b-0 lg:border-r border-slate-200 relative">
                
                <!-- AI Loading Overlay -->
                <div id="ai-loading-overlay" class="hidden absolute inset-0 bg-white/80 z-20 flex flex-col items-center justify-center backdrop-blur-sm">
                    <i data-lucide="sparkles" class="w-8 h-8 text-purple-600 animate-pulse mb-3"></i>
                    <p class="text-sm font-medium text-purple-800" id="ai-loading-text">AI is thinking...</p>
                </div>

                <!-- Toolbar -->
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <select id="language-select" class="bg-white border border-slate-300 text-sm rounded-md px-3 py-1.5 focus-ring text-slate-700 font-medium">
                            <option value="en-US">English (US)</option>
                            <option value="en-GB">English (UK)</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                        </select>
                    </div>
                    <button id="clear-btn" class="text-slate-500 hover:text-red-500 transition-colors p-1" title="Clear text">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Text Area -->
                <textarea 
                    id="text-input" 
                    class="flex-grow w-full p-6 resize-none focus:outline-none text-lg leading-relaxed text-slate-700 bg-transparent placeholder-slate-400" 
                    placeholder="Type or paste your text here to check for grammar and spelling errors..."
                    spellcheck="false"
                ></textarea>

                <!-- Footer / Check Button -->
                <div class="bg-white px-4 py-4 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="text-sm text-slate-500 w-full sm:w-auto text-center sm:text-left">
                        <span id="char-count" class="font-medium">0</span> characters
                    </div>
                    <div class="flex flex-wrap items-center justify-center sm:justify-end gap-2 w-full sm:w-auto">
                        <button id="ai-improve-btn" class="bg-purple-100 hover:bg-purple-200 text-purple-700 px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition-colors focus-ring text-sm" title="Rewrite to improve flow and clarity">
                            ✨ Improve
                        </button>
                        <button id="ai-continue-btn" class="bg-purple-100 hover:bg-purple-200 text-purple-700 px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition-colors focus-ring text-sm" title="Write the next sentence automatically">
                            ✨ Continue
                        </button>
                        <button id="ai-summarize-btn" class="bg-purple-100 hover:bg-purple-200 text-purple-700 px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition-colors focus-ring text-sm" title="Generate a brief summary">
                            ✨ Summarize
                        </button>
                        <button 
                            id="check-btn" 
                            class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium flex items-center gap-2 transition-colors shadow-sm focus-ring disabled:opacity-50 disabled:cursor-not-allowed ml-1"
                        >
                            <i data-lucide="search" class="w-4 h-4"></i>
                            <span>Check Text</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Results & Suggestions -->
            <div class="w-full lg:w-96 bg-slate-50 flex flex-col h-full">
                <div class="px-5 py-4 border-b border-slate-200 bg-white">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i data-lucide="list-checks" class="w-5 h-5 text-blue-600"></i>
                        Suggestions
                    </h2>
                </div>

                <!-- Scrollable Results Container -->
                <div id="results-container" class="flex-grow overflow-y-auto p-5 relative">
                    
                    <!-- Empty State -->
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 p-6 text-center">
                        <i data-lucide="feather" class="w-12 h-12 mb-3 opacity-50"></i>
                        <p class="font-medium text-slate-600 mb-1">No errors found yet</p>
                        <p class="text-sm">Type some text and click "Check Text" to get started.</p>
                    </div>

                    <!-- Loading State -->
                    <div id="loading-state" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-slate-50/80 z-10">
                        <i data-lucide="loader-2" class="w-8 h-8 text-blue-600 animate-spin mb-3"></i>
                        <p class="text-sm font-medium text-slate-600">Analyzing text...</p>
                    </div>

                    <!-- Results List -->
                    <div id="results-list" class="space-y-4 hidden pb-10">
                        <!-- Suggestion cards will be injected here via JavaScript -->
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Custom Message Modal (Replaces browser alerts) -->
    <div id="message-modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full mx-4 overflow-hidden transform scale-95 transition-transform duration-200" id="modal-content">
            <div class="p-5 flex items-start gap-4">
                <div id="modal-icon" class="text-red-500 mt-0.5">
                    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
                <div>
                    <h3 id="modal-title" class="text-lg font-semibold text-slate-800 mb-1">Error</h3>
                    <p id="modal-message" class="text-sm text-slate-600"></p>
                </div>
            </div>
            <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-end">
                <button id="close-modal-btn" class="bg-white border border-slate-300 text-slate-700 px-4 py-1.5 rounded-md text-sm font-medium hover:bg-slate-50 transition-colors focus-ring">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // DOM Elements
        const textInput = document.getElementById('text-input');
        const charCount = document.getElementById('char-count');
        const checkBtn = document.getElementById('check-btn');
        const clearBtn = document.getElementById('clear-btn');
        const languageSelect = document.getElementById('language-select');
        const emptyState = document.getElementById('empty-state');
        const loadingState = document.getElementById('loading-state');
        const resultsList = document.getElementById('results-list');
        const messageModal = document.getElementById('message-modal');
        const modalMessage = document.getElementById('modal-message');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // AI DOM Elements
        const aiImproveBtn = document.getElementById('ai-improve-btn');
        const aiContinueBtn = document.getElementById('ai-continue-btn');
        const aiSummarizeBtn = document.getElementById('ai-summarize-btn');
        const aiLoadingOverlay = document.getElementById('ai-loading-overlay');
        const aiLoadingText = document.getElementById('ai-loading-text');

        // Update character count on input
        textInput.addEventListener('input', () => {
            charCount.textContent = textInput.value.length;
            // Show empty state if text is cleared manually
            if (textInput.value.trim() === '') {
                showEmptyState();
            }
        });

        // Clear button functionality
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            charCount.textContent = '0';
            showEmptyState();
            textInput.focus();
        });

        // Modal functionality
        function showMessage(message, title = 'Notice') {
            document.getElementById('modal-title').textContent = title;
            modalMessage.textContent = message;
            messageModal.classList.remove('hidden');
            messageModal.classList.add('flex');
            setTimeout(() => document.getElementById('modal-content').classList.remove('scale-95'), 10);
        }

        closeModalBtn.addEventListener('click', () => {
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => {
                messageModal.classList.add('hidden');
                messageModal.classList.remove('flex');
            }, 200);
        });

        // UI State Management
        function showLoading() {
            emptyState.classList.add('hidden');
            resultsList.classList.add('hidden');
            loadingState.classList.remove('hidden');
            checkBtn.disabled = true;
        }

        function showEmptyState() {
            loadingState.classList.add('hidden');
            resultsList.classList.add('hidden');
            emptyState.classList.remove('hidden');
            emptyState.innerHTML = `
                <i data-lucide="feather" class="w-12 h-12 mb-3 opacity-50"></i>
                <p class="font-medium text-slate-600 mb-1">No errors found yet</p>
                <p class="text-sm">Type some text and click "Check Text" to get started.</p>
            `;
            lucide.createIcons();
            checkBtn.disabled = false;
        }

        function showPerfectState() {
            loadingState.classList.add('hidden');
            resultsList.classList.add('hidden');
            emptyState.classList.remove('hidden');
            emptyState.innerHTML = `
                <div class="bg-green-100 text-green-600 p-3 rounded-full mb-3">
                    <i data-lucide="check" class="w-8 h-8"></i>
                </div>
                <p class="font-medium text-slate-800 mb-1">Looks perfect!</p>
                <p class="text-sm text-slate-500">We couldn't find any grammar or spelling issues.</p>
            `;
            lucide.createIcons();
            checkBtn.disabled = false;
        }

        // Main Check Function via LanguageTool API
        async function checkGrammar() {
            const text = textInput.value;
            const language = languageSelect.value;

            if (!text.trim()) {
                showMessage("Please enter some text to check.", "Empty Input");
                return;
            }

            showLoading();

            try {
                // Public free API endpoint for LanguageTool
                const response = await fetch('https://api.languagetool.org/v2/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json'
                    },
                    body: new URLSearchParams({
                        text: text,
                        language: language
                    })
                });

                if (!response.ok) {
                    throw new Error('API request failed');
                }

                const data = await response.json();
                displayResults(data.matches);

            } catch (error) {
                console.error('Error checking grammar:', error);
                showMessage("Unable to connect to the grammar check service. Please check your internet connection or try again later.", "Connection Error");
                showEmptyState();
            } finally {
                checkBtn.disabled = false;
            }
        }

        // Display results in the sidebar
        function displayResults(matches) {
            loadingState.classList.add('hidden');
            emptyState.classList.add('hidden');
            
            if (!matches || matches.length === 0) {
                showPerfectState();
                return;
            }

            resultsList.innerHTML = '';
            resultsList.classList.remove('hidden');

            matches.forEach((match, index) => {
                // Extract error details
                const message = match.message;
                const contextText = match.context.text;
                const offset = match.context.offset;
                const length = match.context.length;
                const rule = match.rule.category.name;
                
                // Highlight the specific error word in the context snippet
                const before = contextText.substring(0, offset);
                const errorWord = contextText.substring(offset, offset + length);
                const after = contextText.substring(offset + length);
                
                // Get replacements (limit to top 3 for UI cleanliness)
                const replacements = match.replacements.slice(0, 3);

                // Create Card
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-lg border border-red-100 shadow-sm relative';
                
                // Determine icon and color based on rule type
                let iconName = 'alert-circle';
                let iconColor = 'text-red-500';
                let badgeColor = 'bg-red-50 text-red-700 border-red-200';
                
                if (rule.toLowerCase().includes('style') || rule.toLowerCase().includes('typography')) {
                    iconName = 'info';
                    iconColor = 'text-blue-500';
                    badgeColor = 'bg-blue-50 text-blue-700 border-blue-200';
                }

                // Card HTML Structure
                let cardHTML = `
                    <div class="flex items-start gap-3 mb-2">
                        <i data-lucide="${iconName}" class="w-5 h-5 ${iconColor} mt-0.5 flex-shrink-0"></i>
                        <div>
                            <span class="inline-block px-2 py-0.5 rounded text-xs font-medium border ${badgeColor} mb-2">${rule}</span>
                            <p class="text-sm font-medium text-slate-800 mb-2">${message}</p>
                            
                            <!-- Context snippet -->
                            <div class="bg-slate-50 px-3 py-2 rounded text-sm text-slate-600 font-mono mb-3 border border-slate-100">
                                ${before}<span class="bg-red-100 text-red-700 font-semibold px-1 rounded mx-0.5 border-b-2 border-red-400">${errorWord}</span>${after}
                            </div>
                `;

                // Add suggestion buttons if available
                if (replacements.length > 0) {
                    cardHTML += `<div class="flex flex-wrap gap-2">`;
                    replacements.forEach(rep => {
                        // We use data attributes to store exact position logic for the replacement
                        cardHTML += `
                            <button 
                                class="apply-fix-btn bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 px-3 py-1.5 rounded-md text-sm font-medium transition-colors flex items-center gap-1 focus-ring"
                                data-offset="${match.offset}"
                                data-length="${match.length}"
                                data-value="${rep.value.replace(/"/g, '&quot;')}"
                            >
                                <i data-lucide="check" class="w-3.5 h-3.5"></i>
                                ${rep.value}
                            </button>
                        `;
                    });
                    cardHTML += `</div>`;
                } else {
                    cardHTML += `<p class="text-xs text-slate-500 italic">No automated suggestions available.</p>`;
                }

                cardHTML += `
                        </div>
                    </div>
                `;

                card.innerHTML = cardHTML;
                resultsList.appendChild(card);
            });

            lucide.createIcons();
            attachFixListeners();
        }

        // Attach event listeners to all generated "Fix" buttons
        function attachFixListeners() {
            const fixButtons = document.querySelectorAll('.apply-fix-btn');
            fixButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const offset = parseInt(this.getAttribute('data-offset'));
                    const length = parseInt(this.getAttribute('data-length'));
                    const replacement = this.getAttribute('data-value');
                    
                    applyFix(offset, length, replacement);
                });
            });
        }

        // Apply a suggested fix to the textarea
        function applyFix(offset, length, replacement) {
            const currentText = textInput.value;
            
            // Replace the text based on strict offsets provided by the API
            const newText = currentText.substring(0, offset) + replacement + currentText.substring(offset + length);
            
            textInput.value = newText;
            charCount.textContent = newText.length;
            
            // Re-run the grammar check automatically to update remaining offsets and errors
            // This is crucial because applying one fix changes the string offsets for all subsequent errors
            checkGrammar();
        }

        // Bind main button click
        checkBtn.addEventListener('click', checkGrammar);

        // --- GEMINI API INTEGRATION ---
        
        const apiKey = ""; // Environment handles the API Key injection
        
        async function callGeminiAPI(prompt, systemInstructionText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstructionText }] }
            };

            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || '';
                } catch (error) {
                    if (attempt === maxRetries) {
                        console.error('Gemini API Error:', error);
                        throw error;
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[attempt]));
                }
            }
        }

        function showAILoading(text) {
            aiLoadingText.textContent = text;
            aiLoadingOverlay.classList.remove('hidden');
            textInput.disabled = true;
        }

        function hideAILoading() {
            aiLoadingOverlay.classList.add('hidden');
            textInput.disabled = false;
            textInput.focus();
        }

        aiImproveBtn.addEventListener('click', async () => {
            const text = textInput.value;
            if (!text.trim()) {
                showMessage("Please enter some text to improve.", "Empty Input");
                return;
            }

            showAILoading("✨ Improving your text...");
            try {
                const systemPrompt = "You are an expert copyeditor. Rewrite the following text to improve its grammar, clarity, flow, and vocabulary. Make it sound professional yet natural. Do not change the core meaning. Only return the rewritten text, without any conversational filler, markdown formatting, or quotes.";
                const improvedText = await callGeminiAPI(text, systemPrompt);
                
                if (improvedText) {
                    textInput.value = improvedText.trim();
                    charCount.textContent = textInput.value.length;
                    checkGrammar(); // Re-run grammar check on new text to show it's perfect
                }
            } catch (error) {
                showMessage("Failed to improve text. Please try again later.", "AI Error");
            } finally {
                hideAILoading();
            }
        });

        aiContinueBtn.addEventListener('click', async () => {
            const text = textInput.value;
            if (!text.trim()) {
                showMessage("Please enter some text to continue.", "Empty Input");
                return;
            }

            showAILoading("✨ Generating continuation...");
            try {
                const systemPrompt = "You are a creative writing assistant. Read the provided text and write 1-3 new sentences that naturally continue the thought or story. Keep the tone consistent with the original text. ONLY return the newly generated sentences. Do not repeat the original text. Do not use quotes or conversational filler.";
                const continuation = await callGeminiAPI(text, systemPrompt);
                
                if (continuation) {
                    // Add a space if the current text doesn't end with whitespace
                    const separator = (text.endsWith(' ') || text.endsWith('\n')) ? '' : ' ';
                    textInput.value = text + separator + continuation.trim();
                    charCount.textContent = textInput.value.length;
                    checkGrammar();
                }
            } catch (error) {
                showMessage("Failed to generate continuation. Please try again later.", "AI Error");
            } finally {
                hideAILoading();
            }
        });

        aiSummarizeBtn.addEventListener('click', async () => {
            const text = textInput.value;
            if (!text.trim()) {
                showMessage("Please enter some text to summarize.", "Empty Input");
                return;
            }

            showAILoading("✨ Summarizing text...");
            try {
                const systemPrompt = "You are an expert summarizer. Provide a brief, one or two sentence summary of the following text. Capture the main idea clearly and concisely. Only return the summary text.";
                const summary = await callGeminiAPI(text, systemPrompt);
                
                if (summary) {
                    showMessage(summary.trim(), "AI Summary");
                }
            } catch (error) {
                showMessage("Failed to generate summary. Please try again later.", "AI Error");
            } finally {
                hideAILoading();
            }
        });

    </script>
</body>
</html>
